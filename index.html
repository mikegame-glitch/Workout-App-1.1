<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080810;--surface:#10101a;--surface2:#16161f;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#f2f2f7;--muted:rgba(242,242,247,0.44);--hint:rgba(242,242,247,0.22);
  --r:22px;--r-sm:16px;--r-xs:10px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--text)}

/* SCREENS */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;transition:transform 0.38s cubic-bezier(.77,0,.18,1),opacity 0.38s ease;will-change:transform}
.screen.hidden-right{transform:translateX(100%);opacity:0;pointer-events:none}
.screen.hidden-left{transform:translateX(-100%);opacity:0;pointer-events:none}
.screen.visible{transform:translateX(0);opacity:1}

/* ═══════════════ PAGE 1 — ACCUEIL ═══════════════ */
#page1{background:#111;padding:0 0 40px}
.p1-header{padding:56px 18px 20px;display:flex;align-items:flex-start;justify-content:space-between}
.p1-eyebrow{font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.p1-title{font-size:28px;font-weight:800;letter-spacing:-0.04em;line-height:1.05;color:var(--text)}
.rings-svg{width:56px;height:56px;flex-shrink:0}

/* GRID — 2 col, alternating big card */
.days-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}

/* default card */
.day-card{
  border-radius:18px;overflow:hidden;position:relative;
  height:175px;cursor:pointer;
  transition:transform 0.2s cubic-bezier(.34,1.4,.64,1), filter 0.2s;
  background:#222;
}
/* every 5th card spans full width (like "7 MINUTES" card in the photo) */
.day-card:nth-child(5n+3){grid-column:1/3;height:160px}

.day-card:hover{transform:scale(1.025);filter:brightness(1.06)}
.day-card:active{transform:scale(0.96)}

.day-card img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform 0.35s ease;
}
.day-card:hover img{transform:scale(1.04)}

/* dark gradient from bottom */
.day-card .dc-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.3) 45%, rgba(0,0,0,0.05) 100%);
}

/* label block bottom-left */
.day-card .dc-content{
  position:absolute;inset:0;padding:14px;
  display:flex;flex-direction:column;justify-content:flex-end;
}
.day-card .dc-label{
  font-size:20px;font-weight:900;letter-spacing:-0.01em;
  color:#fff;line-height:1;text-transform:uppercase;
  text-shadow:0 2px 8px rgba(0,0,0,0.5);
}
/* wide card gets bigger label */
.day-card:nth-child(5n+3) .dc-label{font-size:24px}

.day-card .dc-sub{
  font-size:11px;font-weight:500;color:rgba(255,255,255,0.6);
  margin-top:4px;letter-spacing:0.01em;
}

/* top-right badge */
.day-card .dc-badge{
  position:absolute;top:12px;right:12px;
  padding:3px 10px;border-radius:20px;
  font-size:10px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;
  backdrop-filter:blur(8px);
  background:rgba(0,0,0,0.45);color:rgba(255,255,255,0.88);
  display:flex;align-items:center;gap:5px;
}
.day-card .dc-badge::before{
  content:'';width:5px;height:5px;border-radius:50%;
  background:currentColor;display:block;flex-shrink:0;
}

/* ═══════════════ PAGE 2 — PROGRAMME ═══════════════ */
#page2{background:#1a1a1a;padding:0 0 50px}

/* HERO */
.p2-hero{position:relative;height:320px;overflow:hidden}
.p2-hero img{width:100%;height:100%;object-fit:cover;display:block;object-position:center top}
.p2-hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.1) 40%, rgba(26,26,26,0.85) 80%, #1a1a1a 100%)}
.p2-back{position:absolute;top:52px;left:16px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;cursor:pointer;border:0.5px solid rgba(255,255,255,0.18);transition:background 0.15s}
.p2-back:hover{background:rgba(255,255,255,0.12)}
.p2-back svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* HERO CONTENT */
.p2-hero-content{position:absolute;bottom:0;left:0;right:0;padding:0 20px 20px}
.p2-day-name{font-size:30px;font-weight:800;letter-spacing:-0.03em;color:#fff;line-height:1.1;margin-bottom:12px}
.p2-stats-inline{display:flex;gap:18px;margin-bottom:18px}
.p2-stat-item{display:flex;align-items:center;gap:6px;font-size:13px;color:rgba(255,255,255,0.75);font-weight:500}
.p2-stat-item svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex-shrink:0}

/* START BUTTON */
.start-btn{display:flex;align-items:center;justify-content:space-between;width:100%;background:#d4f000;border:none;border-radius:50px;padding:15px 18px 15px 30px;cursor:pointer;transition:transform 0.15s, filter 0.15s;margin-bottom:0}
.start-btn:hover{filter:brightness(1.08);transform:scale(1.01)}
.start-btn:active{transform:scale(0.98)}
.start-btn-text{font-size:17px;font-weight:800;color:#111;letter-spacing:-0.01em}
.start-btn-icon{width:42px;height:42px;border-radius:50%;background:#111;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.start-btn-icon svg{width:16px;height:16px;fill:#d4f000;margin-left:2px}

/* CHEVRON SCROLL HINT */
.scroll-hint{display:flex;justify-content:center;padding:10px 0 6px;color:rgba(255,255,255,0.3)}
.scroll-hint svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ROUND SECTION */
.round-section{margin:10px 0 0}
.round-header{font-size:16px;font-weight:700;color:#fff;padding:14px 20px 10px;letter-spacing:-0.01em}

/* EX CARD — new style */
.ex-list{display:flex;flex-direction:column;gap:0;padding:0}

.ex-card{display:flex;align-items:center;padding:10px 20px;cursor:pointer;transition:background 0.15s;position:relative;background:transparent;border:none;border-radius:0;overflow:visible}
.ex-card:hover{background:rgba(255,255,255,0.04)}
.ex-card.active{background:rgba(255,255,255,0.06)}

/* thumbnail */
.ex-thumb-wrap{position:relative;width:68px;height:68px;border-radius:14px;overflow:hidden;flex-shrink:0;margin-right:14px}
.ex-thumb{width:100%;height:100%;object-fit:cover;display:block}
.ex-thumb-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.18)}

/* text */
.ex-body{flex:1;min-width:0}
.ex-name{font-size:15px;font-weight:600;color:#fff;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-time{font-size:13px;color:rgba(255,255,255,0.45);font-weight:400}

/* play btn */
.ex-play-icon{width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:border-color 0.15s, background 0.15s}
.ex-card:hover .ex-play-icon,.ex-card.active .ex-play-icon{border-color:var(--day-color,#d4f000);background:rgba(212,240,0,0.08)}
.ex-play-icon svg{width:13px;height:13px;fill:#fff;margin-left:2px}
.ex-card.active .ex-play-icon svg{fill:var(--day-color,#d4f000)}

/* VIDEO PLAYER */
.video-player-wrap{
  overflow:hidden;
  max-height:0;
  transition:max-height 0.42s cubic-bezier(.77,0,.18,1), opacity 0.3s ease;
  opacity:0;
  margin:0 20px;
  border-radius:var(--r);
}
.video-player-wrap.open{
  max-height:240px;
  opacity:1;
  margin:0 20px 12px;
}
.video-player-wrap iframe{
  width:100%;
  height:200px;
  border:none;
  display:block;
  border-radius:var(--r);
  background:#000;
}
.video-close-btn{
  display:flex;align-items:center;justify-content:flex-end;
  padding:8px 4px 6px;gap:6px;
  font-size:11px;font-weight:600;color:var(--muted);
  cursor:pointer;letter-spacing:0.04em;text-transform:uppercase;
}
.video-close-btn:hover{color:var(--text)}
.video-close-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}

/* TOTAL */
.total-card{margin:16px 20px 0;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.1);border-radius:var(--r-sm);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.total-card .lbl{font-size:12px;color:var(--muted)}
.total-card .val{font-size:16px;font-weight:700;color:var(--text)}

/* hide old elements */
.p2-tag,.p2-day-meta,.stats-row,.p2-section{display:none}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.days-grid .day-card{animation:fadeUp 0.35s ease both}
.days-grid .day-card:nth-child(1){animation-delay:.04s}
.days-grid .day-card:nth-child(2){animation-delay:.09s}
.days-grid .day-card:nth-child(3){animation-delay:.14s}
.days-grid .day-card:nth-child(4){animation-delay:.19s}
.days-grid .day-card:nth-child(5){animation-delay:.24s}
.days-grid .day-card:nth-child(6){animation-delay:.29s}
.days-grid .day-card:nth-child(7){animation-delay:.34s}
.ex-card{animation:fadeUp 0.3s ease both}
.ex-card:nth-child(1){animation-delay:.03s}.ex-card:nth-child(2){animation-delay:.07s}
.ex-card:nth-child(3){animation-delay:.11s}.ex-card:nth-child(4){animation-delay:.15s}
.ex-card:nth-child(5){animation-delay:.19s}
</style>
</head>

      {name:'Pect Haltères', time:'10 min', img:'https://images.unsplash.com/photo-1597452485595-3f10a74fe5ec?w=400&auto=format&fit=crop&q=80', url:'https://www.youtube.com/watch?v=tusmBTsRkvA'},
      {name:'Pect Haltères', time:'8 min',  img:'https://images.unsplash.com/photo-1530822847156-5df684ec5105?w=400&auto=format&fit=crop&q=80', url:'https://www.youtube.com/watch?v=o-W8CYduTSU'},
      {name:'Pect Pompe XXL',time:'8 min',  img:'https://images.unsplash.com/photo-1581009137042-c552e485697a?w=400&auto=format&fit=crop&q=80', url:'https://www.youtube.com/watch?v=A61dLcsS9Ck'},
    ]
  },
  {
    name:'Dimanche', short:'DIM', color:'#8e8e9e', colorBg:'rgba(142,142,158,0.16)',
    dur:'10 min', kcal:'90',
    img:'https://images.unsplash.com/photo-1584380844320-f8296a04eabe?q=80&w=749&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D',
    exercises:[
      {name:'Pect Pompe 100',time:'6 min', img:'https://images.unsplash.com/photo-1594737625785-a6cbdabd333c?w=400&auto=format&fit=crop&q=80', url:'https://www.youtube.com/watch?v=tSFrzHPGZwM'},
      {name:'ABS Halt',      time:'5 min', img:'https://images.unsplash.com/photo-1518310383802-640c2de311b2?w=400&auto=format&fit=crop&q=80', url:'https://www.youtube.com/watch?v=FLt6CEXRzvU'},
    ]
  },
];

const p1=document.getElementById('page1');
const p2=document.getElementById('page2');
const grid=document.getElementById('daysGrid');

/* Build page 1 grid */
DAYS.forEach((d,i)=>{
  const card=document.createElement('div');
  card.className='day-card';
  card.innerHTML=`
    <img src="${d.img}" alt="${d.name}" loading="${i<4?'eager':'lazy'}">
    <div class="dc-overlay"></div>
    <div class="dc-badge" style="color:${d.color}">${d.dur}</div>
    <div class="dc-content">
      <div class="dc-label">${d.name}</div>
      <div class="dc-sub">${d.exercises.length} exercices · ${d.kcal} kcal</div>
    </div>
  `;
  card.addEventListener('click',()=>openDay(i));
  grid.appendChild(card);
});

function openDay(i){
  const d=DAYS[i];
  const total=d.exercises.reduce((s,e)=>s+parseInt(e.time)||0,0);

  document.getElementById('p2Img').src=d.img;
  document.getElementById('p2Name').textContent=d.name;

  // Stats inline below title
  document.getElementById('p2StatsInline').innerHTML=`
    <div class="p2-stat-item">
      <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      ${d.kcal} Kcal
    </div>
    <div class="p2-stat-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      ${d.dur}
    </div>
  `;

  const list=document.getElementById('exList');
  list.innerHTML='';

  // Group exercises into rounds of 3
  const roundSize=3;
  const rounds=[];
  for(let r=0;r<d.exercises.length;r+=roundSize){
    rounds.push(d.exercises.slice(r,r+roundSize));
  }

  rounds.forEach((exs, roundIdx)=>{
    const section=document.createElement('div');
    section.className='round-section';
    section.innerHTML=`<div class="round-header">Round ${roundIdx+1}</div>`;
    list.appendChild(section);

    exs.forEach((ex)=>{
      const ytMatch = ex.url.match(/(?:v=|youtu\.be\/)([^&?/]+)/);
      const ytId = ytMatch ? ytMatch[1] : null;

      const card=document.createElement('div');
      card.className='ex-card';
      card.style.setProperty('--day-color', d.color);
      card.innerHTML=`
        <div class="ex-thumb-wrap">
          <img class="ex-thumb" src="${ex.img}" alt="${ex.name}" loading="lazy">
          <div class="ex-thumb-overlay"></div>
        </div>
        <div class="ex-body">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-time">${ex.time}</div>
        </div>
        <div class="ex-play-icon">
          <svg viewBox="0 0 16 16"><path d="M4 2.5l9 5.5-9 5.5z"/></svg>
        </div>
      `;

      const playerWrap=document.createElement('div');
      playerWrap.className='video-player-wrap';
      playerWrap.innerHTML=`
        <div class="video-close-btn">
          <svg viewBox="0 0 14 14"><line x1="2" y1="2" x2="12" y2="12"/><line x1="12" y1="2" x2="2" y2="12"/></svg>
          Fermer
        </div>
        <iframe src="" data-src="https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1"
          allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      `;

      card.addEventListener('click',()=>{
        const isOpen=card.classList.contains('active');
        list.querySelectorAll('.ex-card.active').forEach(c=>c.classList.remove('active'));
        list.querySelectorAll('.video-player-wrap.open').forEach(p=>{
          p.classList.remove('open');
          p.querySelector('iframe').src='';
        });
        if(!isOpen && ytId){
          card.classList.add('active');
          playerWrap.classList.add('open');
          playerWrap.querySelector('iframe').src=playerWrap.querySelector('iframe').dataset.src;
          setTimeout(()=>{
            card.scrollIntoView({behavior:'smooth',block:'start'});
            p2.scrollTop=p2.scrollTop-12;
          },60);
        }
      });

      playerWrap.querySelector('.video-close-btn').addEventListener('click',(e)=>{
        e.stopPropagation();
        card.classList.remove('active');
        playerWrap.classList.remove('open');
        playerWrap.querySelector('iframe').src='';
      });

      list.appendChild(card);
      list.appendChild(playerWrap);
    });
  });

  document.getElementById('totalCard').innerHTML=`<span class="lbl">Durée totale</span><span class="val">${total} min</span>`;

  p2.scrollTop=0;
  p1.classList.remove('visible'); p1.classList.add('hidden-left');
  p2.classList.remove('hidden-right'); p2.classList.add('visible');
}

document.getElementById('backBtn').addEventListener('click',()=>{
  // Stop any playing video before going back
  document.querySelectorAll('.video-player-wrap.open iframe').forEach(f=>f.src='');
  document.querySelectorAll('.video-player-wrap.open').forEach(p=>p.classList.remove('open'));
  document.querySelectorAll('.ex-card.active').forEach(c=>c.classList.remove('active'));

  p2.classList.remove('visible'); p2.classList.add('hidden-right');
  p1.classList.remove('hidden-left'); p1.classList.add('visible');
});
</script>
</body>
</html>
